name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "18"
            label: Ubuntu / Node.js 18
          - os: ubuntu-latest
            node-version: "20"
            label: Ubuntu / Node.js 20
          - os: ubuntu-latest
            node-version: "22"
            label: Ubuntu / Node.js 22
          - os: windows-latest
            node-version: "22"
            label: Windows / Node.js 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run checks and regression tests
        run: npm run ci

  monitor:
    name: Windows / residential-monitor
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check monitor version alignment
        run: node scripts/sync-monitor-version.js --check

      - name: Install monitor frontend dependencies
        shell: pwsh
        run: npm --prefix residential-monitor ci

      - name: Check monitor frontend
        shell: pwsh
        run: npm --prefix residential-monitor run check

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path residential-monitor/src-tauri/Cargo.toml --check

      - name: Lint Rust workspace
        shell: pwsh
        run: cargo clippy --manifest-path residential-monitor/src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --manifest-path residential-monitor/src-tauri/Cargo.toml --workspace

      - name: Scan public template secrets
        shell: pwsh
        run: npm run check:secrets

  docs:
    name: Ubuntu / docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install docs dependencies
        run: npm --prefix docs ci

      - name: Build docs
        run: npm --prefix docs run build

  required-checks:
    name: Required checks
    needs: [test, monitor, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all test jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.monitor.result }}" != "success" ] || [ "${{ needs.docs.result }}" != "success" ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi
